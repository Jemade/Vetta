apiVersion: v1
kind: ConfigMap
metadata:
  name: vetta-config
  namespace: vetta
  labels:
    app.kubernetes.io/name: vetta
    app.kubernetes.io/component: config
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  HOST: "0.0.0.0"
  PORT: "8000"
  RATE_LIMIT_PER_MINUTE: "120"
  USE_CELERY: "true"
  REDIS_URL: "redis://vetta-redis.vetta.svc.cluster.local:6379/0"
  CELERY_BROKER_URL: "redis://vetta-redis.vetta.svc.cluster.local:6379/0"
  CELERY_RESULT_BACKEND: "redis://vetta-redis.vetta.svc.cluster.local:6379/1"
  LLM_MODEL: "gemini-2.5-flash"
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "vetta-production-interview-artifacts"
  LOCAL_STORAGE_DIR: "/app/storage_uploads"
